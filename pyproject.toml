[project]
name = "hack"
version = "0.1.0"
description = "DXA quality hackathon project"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "configs*", "artifacts*", "scripts*", "tests*"]